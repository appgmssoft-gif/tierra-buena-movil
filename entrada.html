<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcar asistencia · Tierra Buena</title>
<meta name="theme-color" content="#2e7d5b">
<style>
  :root { --fondo:#f6f3ec; --texto:#1f2a24; --suave:#55655b; --acento:#2e7d5b; --tarjeta:#ffffff; --borde:#cfd8d1; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#15201a; --texto:#eef4ef; --suave:#b6c6bb; --acento:#6fbf93; --tarjeta:#1d2c23; --borde:#34473b; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--fondo); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); }
  main { max-width: 440px; margin: 0 auto; padding: 28px 0 40px; animation: entAparece .5s ease-out both; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  .ent-act { font-size: 1.1rem; margin: 0 0 18px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 14px 16px; }
  .ent-act span { color: var(--suave); font-size: .95rem; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--borde); background: var(--tarjeta); color: var(--texto); }
  input:focus, button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  .ent-pregunta { font-weight: 700; margin: 20px 0 8px; }
  .ent-tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ent-tipo { font: inherit; text-align: left; padding: 14px; border-radius: 14px; border: 2px solid var(--borde); background: var(--tarjeta); color: var(--texto); cursor: pointer; transition: transform .15s, border-color .15s, background .15s; display: grid; gap: 4px; }
  .ent-tipo span { color: var(--suave); font-size: .88rem; }
  .ent-tipo:active { transform: scale(.98); }
  .ent-tipo[aria-pressed="true"] { border-color: var(--acento); background: color-mix(in srgb, var(--acento) 14%, var(--tarjeta)); }
  .ent-enviar { margin-top: 20px; width: 100%; font: inherit; font-weight: 700; padding: 15px; border: 0; border-radius: 14px; background: var(--acento); color: #fff; cursor: pointer; }
  .ent-enviar:disabled { opacity: .6; cursor: default; }
  .ent-aviso { color: #b3261e; font-weight: 600; margin: 12px 0 0; }
  .ent-privado { color: var(--suave); font-size: .9rem; margin-top: 18px; }
  .ent-cerrado { font-size: 1.1rem; text-align: center; padding: 40px 10px; }
  .ent-ok { width: 96px; height: 96px; margin: 24px auto 14px; }
  .ent-ok svg { width: 100%; height: 100%; fill: none; stroke: var(--acento); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  .ent-ok circle { stroke-dasharray: 152; stroke-dashoffset: 152; animation: entDibuja .6s ease-out forwards; }
  .ent-ok path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: entDibuja .4s .5s ease-out forwards; }
  .ent-ok, .ent-ok h1, .ent-ok + h1 { text-align: center; }
  #entCuerpo > h1 { text-align: left; }
  #entCuerpo > h1 + p, #entCuerpo > p { text-align: center; }
  .ent-bien { color: var(--acento); font-weight: 600; text-align: center; }
  .ent-gracias { text-align: center; }
  .ent-bendicion { margin: 18px 0; padding: 16px 18px; border-left: 4px solid var(--acento); background: var(--tarjeta); border-radius: 12px; font-style: italic; }
  .ent-bendicion p { margin: 0 0 6px; font-size: 1.1rem; }
  .ent-bendicion cite { font-style: normal; color: var(--suave); font-size: .88rem; }
  .ent-probar { display: block; text-align: center; margin: 18px 0 6px; padding: 14px; border-radius: 14px; border: 2px solid var(--acento); color: var(--acento); font-weight: 700; text-decoration: none; transition: background .2s; }
  .ent-probar:hover { background: color-mix(in srgb, var(--acento) 12%, transparent); }
  .ent-act span { display: inline-block; margin-top: 2px; }
  .ent-enviar:active { transform: scale(.99); }
  @keyframes entAparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes entDibuja { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { main, .ent-ok circle, .ent-ok path { animation: none; } .ent-ok circle, .ent-ok path { stroke-dashoffset: 0; } }
</style>
</head>
<body>
<main>
  <div id="entCuerpo"><p class="ent-cerrado">Cargando…</p></div>
</main>
<script src="entrada.js"></script>
</body>
</html>
